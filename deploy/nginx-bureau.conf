# BUREAU — nginx site.
#
# Serves the self-contained frontend and proxies /api and /health to the
# backend running on localhost:8080 (the all-in-one container).
#
# The hostpanel log format carries the site name ($host), so the panel can
# break traffic down per site (people, bots, data centers). Logs go to the
# default /var/log/nginx/access.log that the panel reads.
#
# Edit SERVER_NAME below, drop this file in /etc/nginx/sites-available/bureau,
# symlink it into sites-enabled, then `nginx -t && systemctl reload nginx`.
# The server-setup.sh script does all of that for you.

log_format hostpanel '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time host=$host';

server {
    listen 80;
    listen [::]:80;
    server_name blxssed.example.com;   # ← your domain (or the server IP)

    access_log /var/log/nginx/access.log hostpanel;

    # backend: API + health
    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # frontend: one self-contained file, SPA fallback
    root /var/www/bureau;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}
