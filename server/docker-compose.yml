# BUREAU backend. Three services on one image, plus Postgres.
#
#   docker compose up -d db
#   docker compose run --rm api node dist/util/migrate.js
#   docker compose up -d
#
# The signer is deliberately NOT published to the host: only the api and the
# worker can reach it, over the internal network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bureau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bureau}
      POSTGRES_DB: bureau
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bureau"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bureau:${POSTGRES_PASSWORD:-bureau}@db:5432/bureau
      SIGNER_URL: http://signer:8081
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8080:8080"
    command: ["node", "dist/server.js"]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bureau:${POSTGRES_PASSWORD:-bureau}@db:5432/bureau
      SIGNER_URL: http://signer:8081
    depends_on:
      db: { condition: service_healthy }
    command: ["node", "dist/workers/index.js"]

  signer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://bureau:${POSTGRES_PASSWORD:-bureau}@db:5432/bureau
      SIGNER_HOST: 0.0.0.0
    depends_on:
      db: { condition: service_healthy }
    # no ports: unreachable from outside the compose network
    expose:
      - "8081"
    command: ["node", "dist/signer/service.js"]

volumes:
  db:
